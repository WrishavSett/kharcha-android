name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/kharcha.apk
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-1.0.${{ github.run_number }}
          path: out/kharcha.apk
          if-no-files-found: error

      # Keeps one "latest" release whose kharcha.apk is always the newest build of the
      # default branch, so the phone download link never changes.
      - name: Publish latest release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/kharcha.apk \
            --title "Kharcha 1.0.${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download kharcha.apk on your phone and open it to install." \
            --latest
